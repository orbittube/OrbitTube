<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 OrbitTube — Стримы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #1a1a1a;
            --bg-hover: #272727;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #606060;
            --border-color: #303030;
            --accent: #00d4ff;
            --shadow: rgba(0, 0, 0, 0.5);
            --sidebar-width: 240px;
            --header-height: 56px;
            --radius: 12px;
            --transition: 0.3s ease;
        }
        [data-theme="light"] {
            --bg-primary: #f9f9f9;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #e5e5e5;
            --text-primary: #0f0f0f;
            --text-secondary: #606060;
            --text-muted: #909090;
            --border-color: #d9d9d9;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        [data-theme="cosmic"] {
            --bg-primary: #0b0e17;
            --bg-secondary: #121a26;
            --bg-card: #121a26;
            --bg-hover: #1a2636;
            --text-primary: #e0e6f0;
            --text-secondary: #7a8a9e;
            --text-muted: #4a5a6e;
            --border-color: #1f2a3a;
            --accent: #00d4ff;
            --shadow: rgba(0, 0, 0, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            overflow: hidden;
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 8px;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .menu-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover { background: var(--bg-hover); }
        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
        }
        .logo i { font-size: 20px; }
        .logo span {
            background: linear-gradient(135deg, var(--accent), #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-center {
            flex: 1;
            max-width: 400px;
            min-width: 60px;
            display: flex;
            align-items: center;
        }
        .search-box {
            display: flex;
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
        }
        .search-box input {
            flex: 1;
            padding: 6px 12px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            min-width: 40px;
        }
        .search-box input::placeholder { color: var(--text-muted); font-size: 13px; }
        .search-box button {
            background: var(--bg-hover);
            border: none;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover { background: var(--border-color); }
        .header-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        /* ===== САЙДБАР ===== */
        .sidebar {
            position: fixed;
            top: var(--header-height);
            left: 0;
            width: var(--sidebar-width);
            height: calc(100vh - var(--header-height));
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            transition: transform var(--transition);
            z-index: 999;
            padding: 8px 0;
            transform: translateX(-100%);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            min-height: 40px;
            border-left: 3px solid transparent;
        }
        .sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-item.active {
            background: var(--bg-hover);
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 500;
        }
        .sidebar-item i { width: 24px; font-size: 18px; text-align: center; }
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: var(--header-height);
            left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }
        .sidebar-overlay.active { display: block; }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            margin-left: 0;
            margin-top: var(--header-height);
            padding: 12px 12px 80px;
            height: calc(100vh - var(--header-height));
            overflow-y: auto;
            transition: margin-left var(--transition);
            background: var(--bg-primary);
        }

        /* ===== СЕТКА СТРИМОВ ===== */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .video-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }
        .video-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
            border-color: var(--border-color);
        }
        .video-thumbnail {
            position: relative;
            background: var(--bg-hover);
            aspect-ratio: 16/9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .video-info {
            padding: 10px 12px;
            display: flex;
            gap: 10px;
        }
        .video-channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #FF8C00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #000;
        }
        .video-details { flex: 1; min-width: 0; }
        .video-title {
            font-weight: 500;
            font-size: 14px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 3px;
        }
        .video-channel-name { font-size: 12px; color: var(--text-secondary); }
        .video-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ===== ИНТЕРФЕЙС ПРОСМОТРА СТРИМА ===== */
        .stream-view-container {
            display: none;
            flex-direction: column;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .stream-view-container.active { display: flex; }

        .stream-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }
        .exit-stream-btn {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        .exit-stream-btn:hover {
            background: #FF8C00;
            color: #fff;
            border-color: #FF8C00;
        }
        .exit-stream-btn:active { transform: scale(0.96); }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 8px 24px var(--shadow);
        }
        .player-wrapper #twitch-embed {
            width: 100%;
            height: 100%;
        }

        .stream-info-card {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stream-info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .live-badge {
            background: #FF0000;
            color: #fff;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 700;
        }

        /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 54px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            z-index: 1000;
            padding: 0 8px;
            justify-content: space-around;
            align-items: center;
        }
        .bottom-nav.active { display: flex; }
        .bottom-nav button {
            background: none; border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 12px;
        }
        .bottom-nav button i { font-size: 20px; }
        .bottom-nav button.active { color: var(--accent); }

        .footer {
            text-align: center;
            padding: 20px 20px 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 24px;
            clear: both;
            width: 100%;
        }

        @media (min-width: 768px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
            .bottom-nav { display: none !important; }
            .sidebar { transform: translateX(0); width: var(--sidebar-width); }
            .main-content { margin-left: var(--sidebar-width); padding: 16px 20px 40px; }
            .sidebar-overlay { display: none !important; }
        }
        @media (min-width: 1024px) {
            .video-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
        }
        @media (min-width: 1400px) {
            .video-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; }
        }
        @media (max-width: 767px) {
            .bottom-nav { display: flex !important; }
            .main-content { padding-bottom: 80px; }
            .header-center { max-width: 200px; }
            .logo { font-size: 16px; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }
        .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }
        .empty-state h3 { color: var(--text-primary); margin-bottom: 4px; font-size: 18px; }
        .empty-state button {
            margin-top: 16px;
            background: #FF8C00;
            border: none;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
            <div class="logo" id="logoHome"><i class="fas fa-rocket"></i><span>OrbitTube</span></div>
        </div>
        <div class="header-center">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск стримов">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>
        <div class="header-right">
            <button id="addStreamBtn" style="background:#FF8C00;color:#fff;border-radius:20px;padding:0 16px;font-weight:600;font-size:13px;width:auto;height:34px;">
                <i class="fas fa-plus"></i> Добавить
            </button>
        </div>
    </header>

    <!-- ОВЕРЛЕЙ САЙДБАРА -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- САЙДБАР -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-item" data-page="home"><i class="fas fa-home"></i><span>Главная</span></div>
        <div class="sidebar-item active" data-page="streams">
            <i class="fas fa-broadcast"></i>
            <span>Стримы <span style="color:#FF8C00;font-weight:700;font-size:11px;background:rgba(255,140,0,0.2);padding:1px 6px;border-radius:10px;">BETA</span></span>
        </div>
    </nav>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="main-content" id="mainContent">
        <!-- СЕТКА ВСЕХ СТРИМОВ -->
        <div id="pageContent">
            <div class="video-grid" id="streamGrid"></div>
        </div>

        <!-- ПРОСМОТР ВЫБРАННОГО СТРИМА (ПО УМОЛЧАНИЮ СКРЫТ) -->
        <div class="stream-view-container" id="streamPlayerContainer">
            <div class="stream-top-bar">
                <button class="exit-stream-btn" onclick="closeStreamView()">
                    <i class="fas fa-arrow-left"></i> Выйти к стримам
                </button>
                <div style="font-size:14px;color:var(--text-secondary);">
                    <i class="fas fa-broadcast"></i> Прямой эфир
                </div>
            </div>

            <div class="player-wrapper">
                <div id="twitch-embed"></div>
            </div>

            <div class="stream-info-card">
                <div class="stream-info-left">
                    <div class="video-channel-avatar" id="currentAvatar">S</div>
                    <div>
                        <h2 id="currentChannel" style="font-size:18px;font-weight:600;">Канал</h2>
                        <p id="currentTitle" style="font-size:13px;color:var(--text-secondary);">Название стрима</p>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <span class="live-badge" id="currentBadge">LIVE</span>
                    <span id="currentViewers" style="font-size:13px;color:var(--text-secondary);"><i class="fas fa-eye"></i> 0</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>🚀 OrbitTube — стримы без границ</p>
            <p>📡 Добавить стрим: @OrbitTubeStream_bot</p>
        </div>
    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav" id="bottomNav">
        <button data-page="home"><i class="fas fa-home"></i><span>Главная</span></button>
        <button class="active" data-page="streams"><i class="fas fa-broadcast"></i><span>Стримы</span></button>
    </div>

    <script>
        const LANG = {
            ru: {
                no_streams: 'Стримы не найдены',
                no_streams_desc: 'Сейчас никто не стримит, но ты можешь добавить свой стрим!',
                add_stream: 'Добавить стрим',
                live: 'В прямом эфире',
                viewers: 'зрителей',
            }
        };

        let streams = [];

        function t(key) {
            return LANG.ru[key] || key;
        }

        // ===== ЗАГРУЗКА СТРИМОВ =====
        async function loadStreams() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/orbittube/OrbitTube/refs/heads/main/streamplatform');
                if (!response.ok) throw new Error('Не удалось загрузить стримы');
                const data = await response.json();
                streams = data.streams || [];
                renderStreams(streams);
            } catch (e) {
                console.warn('Ошибка загрузки стримов:', e);
                streams = [];
                renderStreams([]);
            }
        }

        // ===== РЕНДЕР СЕТКИ СТРИМОВ =====
        function renderStreams(streamList) {
            const grid = document.getElementById('streamGrid');
            if (!grid) return;

            if (!streamList || streamList.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-broadcast" style="font-size:48px;color:#FF8C00;"></i>
                        <h3>${t('no_streams')}</h3>
                        <p>${t('no_streams_desc')}</p>
                        <button onclick="openBot()">${t('add_stream')}</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = streamList.map(stream => {
                // Проверяем реальное значение isLive (по умолчанию true)
                const isLive = stream.isLive !== false;
                
                return `
                <div class="video-card" onclick="openStream('${stream.idS}')">
                    <div class="video-thumbnail">
                        ${isLive ? `
                        <div style="position:absolute;top:8px;left:8px;background:#FF0000;color:#fff;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:700;z-index:2;">
                            <i class="fas fa-circle" style="font-size:10px;margin-right:4px;animation:blink 1s infinite;"></i> LIVE
                        </div>
                        ` : `
                        <div style="position:absolute;top:8px;left:8px;background:#666;color:#fff;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:700;z-index:2;">
                            OFFLINE
                        </div>
                        `}
                        <img src="${stream.thumbnail || 'https://static-cdn.jtvnw.net/previews-ttv/live_user_default-440x248.jpg'}" 
                             alt="${stream.channel}" 
                             loading="lazy"
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);\\'><i class=\\'fas fa-broadcast\\' style=\\'font-size:48px;\\'></i><span style=\\'margin-top:8px;\\'>${stream.channel}</span></div>'">
                        <div style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.8);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;">
                            <i class="fas fa-eye"></i> ${stream.viewers || 0}
                        </div>
                    </div>
                    <div class="video-info">
                        <div class="video-channel-avatar">
                            ${stream.channel ? stream.channel.charAt(0).toUpperCase() : 'S'}
                        </div>
                        <div class="video-details">
                            <div class="video-title">${stream.title || stream.channel || 'Без названия'}</div>
                            <div class="video-channel-name">
                                ${stream.channel || 'Unknown'}
                            </div>
                            <div class="video-meta">
                                <span><i class="fas fa-eye"></i> ${stream.viewers || 0} ${t('viewers')}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // ===== ОТКРЫТИЕ СТРИМА ВНУТРИ СТРАНИЦЫ =====
        function openStream(idS) {
            const stream = streams.find(s => s.idS === idS);
            if (!stream || !stream.url_player) {
                alert('Стрим временно недоступен');
                return;
            }

            let twitchChannel = null;
            if (stream.url_player.includes('twitch.tv')) {
                const match = stream.url_player.match(/twitch\.tv\/([a-zA-Z0-9_]+)/);
                if (match) twitchChannel = match[1];
            }

            if (!twitchChannel) {
                alert('Поддерживаются только стримы с Twitch');
                return;
            }

            const isLive = stream.isLive !== false;

            // Обновляем метаданные стрима
            document.getElementById('currentChannel').textContent = stream.channel || 'Канал';
            document.getElementById('currentTitle').textContent = stream.title || 'Без названия';
            document.getElementById('currentAvatar').textContent = (stream.channel || 'S').charAt(0).toUpperCase();
            document.getElementById('currentViewers').innerHTML = `<i class="fas fa-eye"></i> ${stream.viewers || 0}`;

            // Настраиваем статус-бейдж LIVE / OFFLINE
            const badge = document.getElementById('currentBadge');
            if (badge) {
                if (isLive) {
                    badge.style.background = '#FF0000';
                    badge.style.animation = 'blink 1s infinite';
                    badge.textContent = 'LIVE';
                } else {
                    badge.style.background = '#666';
                    badge.style.animation = 'none';
                    badge.textContent = 'OFFLINE';
                }
            }

            // Переключаем блоки интерфейса
            document.getElementById('pageContent').style.display = 'none';
            document.getElementById('streamPlayerContainer').classList.add('active');
            document.getElementById('mainContent').scrollTop = 0;

            // Инициализация Плеера через прямой iframe для избежания ошибок
            const host = window.location.hostname || 'localhost';
            const container = document.getElementById('twitch-embed');
            
            container.innerHTML = `
                <iframe 
                    src="https://player.twitch.tv/?channel=${twitchChannel}&parent=${host}&parent=localhost&autoplay=true" 
                    height="100%" 
                    width="100%" 
                    style="border:none;"
                    allowfullscreen>
                </iframe>
            `;
        }

        // ===== КНОПКА «ВЫЙТИ К СТРИМАМ» =====
        function closeStreamView() {
            document.getElementById('twitch-embed').innerHTML = '';
            document.getElementById('streamPlayerContainer').classList.remove('active');
            document.getElementById('pageContent').style.display = 'block';
        }

        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
        function openBot() {
            window.open('https://t.me/OrbitTubeStream', '_blank');
        }

        function searchStreams() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderStreams(streams);
                return;
            }
            const filtered = streams.filter(s => 
                s.channel.toLowerCase().includes(query) || 
                (s.title && s.title.toLowerCase().includes(query))
            );
            renderStreams(filtered);
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.addEventListener('DOMContentLoaded', function() {
            loadStreams();

            document.getElementById('addStreamBtn').addEventListener('click', openBot);
            document.getElementById('searchBtn').addEventListener('click', searchStreams);
            document.getElementById('searchInput').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') searchStreams();
            });

            document.querySelectorAll('.sidebar-item[data-page]').forEach(item => {
                item.addEventListener('click', function() {
                    if (this.dataset.page === 'home') goHome();
                });
            });

            document.querySelectorAll('.bottom-nav button[data-page]').forEach(item => {
                item.addEventListener('click', function() {
                    if (this.dataset.page === 'home') goHome();
                });
            });

            document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
            document.getElementById('logoHome').addEventListener('click', function() {
                if (document.getElementById('streamPlayerContainer').classList.contains('active')) {
                    closeStreamView();
                } else {
                    goHome();
                }
            });

            setInterval(loadStreams, 30000);
        });
    </script>
</body>
</html>
